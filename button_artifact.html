<title>Click Counter</title>
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --ink: #1c1b19;
    --muted: #6c6a64;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --border: #e3e1db;
    --shadow: 0 1px 2px rgba(28, 27, 25, 0.06), 0 8px 24px rgba(28, 27, 25, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1f2124;
      --ink: #ececea;
      --muted: #9a988f;
      --accent: #4fbf9f;
      --accent-ink: #10221c;
      --border: #2e3033;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f4f1; --surface: #ffffff; --ink: #1c1b19; --muted: #6c6a64;
    --accent: #2f6f5e; --accent-ink: #ffffff; --border: #e3e1db;
    --shadow: 0 1px 2px rgba(28, 27, 25, 0.06), 0 8px 24px rgba(28, 27, 25, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --surface: #1f2124; --ink: #ececea; --muted: #9a988f;
    --accent: #4fbf9f; --accent-ink: #10221c; --border: #2e3033;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 2.5rem 2.75rem;
    max-width: 26rem;
    width: 100%;
    text-align: center;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 0.75rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.6rem;
    font-weight: 650;
    text-wrap: balance;
  }
  p.lead {
    margin: 0 0 2rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .count {
    font-size: 3.5rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin: 0 0 1.75rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 0.8rem 1.6rem;
    background: var(--accent);
    color: var(--accent-ink);
    transition: transform 0.08s ease, filter 0.2s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(0.98); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>

<main class="card">
  <p class="eyebrow">Demo</p>
  <h1>Click Counter</h1>
  <p class="lead">A simple interactive button. Each press bumps the count below.</p>
  <p class="count" id="count" aria-live="polite">0</p>
  <button id="btn" type="button">Click me</button>
</main>

<script>
  const countEl = document.getElementById("count");
  const btn = document.getElementById("btn");
  let count = 0;
  btn.addEventListener("click", () => {
    count += 1;
    countEl.textContent = count;
  });
</script>
