; OBS profile for the MedSimQA display wall.
; Import via: OBS > Profile > Import.
;
; Tuned for a 1080p30 dashboard rather than for gameplay. The differences that
; matter:
;
;   * Keyframe interval 2s. A viewer joining the stream waits at most 2s for a
;     keyframe before the picture appears; the gameplay default of 0 (auto)
;     can leave a wall display black for far longer.
;   * veryfast preset with tune=zerolatency. A dashboard is mostly static, so
;     the encoder has an easy job; spending CPU on a slower preset buys almost
;     nothing on this content and costs latency.
;   * Downscale filter Lanczos. Text is the entire content of this stream, and
;     bilinear downscaling makes small text mushy in a way it does not make a
;     game mushy.
;   * Colour range Full. The dashboard is RGB screen content, not video, and
;     limited range crushes the light surface to grey.

[General]
Name=MedSimQA

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=30
ScaleType=lanczos
ColorFormat=NV12
ColorSpace=709
ColorRange=Full

[Output]
Mode=Advanced

[AdvOut]
Encoder=obs_x264
RecEncoder=obs_x264
RecType=Standard
RecFormat=mkv
RecTracks=1
TrackIndex=1
ApplyServiceSettings=true

[SimpleOutput]
VBitrate=4500
ABitrate=160
UseAdvanced=true
Preset=veryfast
RecQuality=Small
RecFormat=mkv

[Audio]
SampleRate=48000
ChannelSetup=Stereo

[Stream1]
; Filled in by setup-obs-stream.sh, or by hand in Settings > Stream.
Service=Custom
Server=rtmp://localhost:1935/live
Key=medsim

[x264]
preset=veryfast
tune=zerolatency
profile=high
keyint_sec=2
bframes=2
rate_control=CBR
bitrate=4500
buffer_size=9000
