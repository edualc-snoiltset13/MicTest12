<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MedSimQA clinician dashboard - review synthetic case studies across chemical pathology, haematology, microbiology and pharmacology." />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M6 21l5-9 5 5 4-8 6 12' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>MedSimQA - Clinician Dashboard</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Duplicated (not imported) on purpose: a module import would run after
      // the first paint, which is exactly the flash this prevents.
      (function () {
        try {
          var stored = localStorage.getItem('medsim.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          var locale = localStorage.getItem('medsim.locale');
          if (locale) document.documentElement.setAttribute('lang', locale);
        } catch (e) {
          /* private browsing with storage disabled - fall back to OS theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This dashboard requires JavaScript. The underlying case data is available
      as JSON from the API at <code>/api/v1/cases</code>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
